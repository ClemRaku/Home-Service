<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customer Profile | HomeService</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <link rel="stylesheet" href="../CSS/CustomerProfile.css" />
  </head>
  <body>
    <div class="profile-layout">
      <aside class="profile-sidebar">
        <div class="brand">
          <img src="../Image/logo.png" alt="HomeServe" />
          <h1>HomeService</h1>
        </div>

        <nav class="profile-nav" aria-label="Customer Profile Navigation">
          <a href="#" class="active">Profile</a>
          <a href="../Html/CustomerBoooking.html">Bookings</a>
          <a href="#">Track</a>
          <a href="#">Settings</a>
          <a href="#">Messages</a>
        </nav>

        <nav class="profile-nav profile-nav-bottom" aria-label="Customer Quick Actions">
          <a href="./Home.html">Back to Home</a>
          <a href="./Login.html">Logout</a>
        </nav>
      </aside>

      <main class="profile-main">
        <a href="./Home.html" class="home-close-btn" aria-label="Back to Home">
          <i class="fa-solid fa-xmark"></i>
        </a>

        <h2 class="page-title">Profile</h2>

        <section class="profile-card">
          <div class="profile-top">
            <div class="avatar-wrap">
              <div class="avatar-box">
                <img
                  id="profileAvatar"
                  src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=240&q=80"
                  alt="Sarah Johnson"
                />
              </div>
              <input
                id="avatarInput"
                class="avatar-input"
                type="file"
                accept="image/*"
                aria-label="Choose a new avatar image"
              />
              <button class="camera-btn" type="button" aria-label="Update avatar">
                <i class="fa-solid fa-camera"></i>
              </button>
            </div>

            <div class="profile-summary">
              <div class="name-row">
                <h3>Sarah Johnson</h3>
                <span class="membership-badge">Premium Member</span>
              </div>

              <div class="info-row">
                <p><i class="fa-solid fa-coins"></i> <strong>2,450 Coins</strong></p>
                <p>
                  <i class="fa-regular fa-money-bill-1"></i>
                  <strong>$125.00</strong>
                  <i class="fa-solid fa-plus wallet-plus-icon" aria-hidden="true"></i>
                </p>
              </div>
            </div>
          </div>

          <div class="form-grid">
            <label>
              <span>Full Name</span>
              <input type="text" value="Sarah Johnson" readonly />
            </label>

            <label>
              <span>Location</span>
              <input type="text" value="New York, NY" readonly />
            </label>

            <label>
              <span>Phone Number</span>
              <input type="text" value="+1 (555) 123-4567" readonly />
            </label>

            <label>
              <span>Email</span>
              <input type="email" value="sarah.johnson@email.com" readonly />
            </label>

            <label class="full">
              <span>Date of Birth</span>
              <input type="text" value="March 15, 1990" readonly />
            </label>

            <label class="full">
              <span>Address</span>
              <textarea readonly>123 Main Street, Apartment 4B, New York, NY 10001</textarea>
            </label>
          </div>

          <div class="actions" id="profileActions">
            <button class="btn btn-primary" id="editProfileBtn" type="button">Edit Profile</button>
            <button class="btn btn-secondary" id="secondaryActionBtn" type="button">Change Password</button>
          </div>
        </section>

        <div class="password-modal-overlay" id="passwordModalOverlay" aria-hidden="true">
          <div class="password-modal" role="dialog" aria-modal="true" aria-labelledby="passwordModalTitle">
            <h3 id="passwordModalTitle">Change Password</h3>

            <label>
              <span>Current Password</span>
              <input type="password" id="currentPasswordInput" />
            </label>

            <label>
              <span>New Password</span>
              <input type="password" id="newPasswordInput" />
            </label>

            <label>
              <span>Confirm New Password</span>
              <input type="password" id="confirmPasswordInput" />
            </label>

            <div class="password-modal-actions">
              <button class="btn modal-save-btn" id="passwordSaveBtn" type="button">Save</button>
              <button class="btn modal-cancel-btn" id="passwordCancelBtn" type="button">Cancel</button>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="../JS/CustomerProfile.js"></script>
  </body>
</html>
